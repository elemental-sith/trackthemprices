name: Check prices
on:
  schedule:
    - cron: "0 6,18 * * *"   # twice a day, 06:00 and 18:00 UTC
  workflow_dispatch:          # manual "Run workflow" button, and the website's instant check
    inputs:
      only_new:
        description: "Only check items that have no price yet"
        type: boolean
        default: false
concurrency:
  group: price-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python tracker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY_NEW: ${{ inputs.only_new }}
