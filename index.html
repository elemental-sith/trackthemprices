<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#f3f5f8; --card:#fff; --fg:#1a1d21; --mute:#6b7280; --line:#e2e5ea; --accent:#2563eb; --accent-soft:#2563eb14; --red:#dc2626; --green:#16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --fg:#e8eaed; --mute:#9aa0a6; --line:#2c3038; --accent:#60a5fa; --accent-soft:#60a5fa1c; --red:#f87171; --green:#4ade80; } }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:900px; margin:auto; padding:20px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1 { margin:0; font-size:1.4rem; }
  input, button { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  button { cursor:pointer; font-weight:500; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.primary:hover { filter:brightness(1.1); }
  button.danger { color:var(--red); border-color:var(--red); background:transparent; } button.danger:hover { background:var(--red); color:#fff; }
  button.pill { padding:5px 12px; border-radius:99px; font-size:.85rem; } button.pill.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #login { max-width:320px; margin:90px auto; display:grid; gap:10px; }
  #add { display:flex; flex-wrap:wrap; gap:8px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  #add input[name=url] { flex:3; min-width:220px; } #add input[name=name] { flex:1; min-width:140px; }
  #msg { min-height:1.4em; margin:8px 2px; font-size:.9rem; color:var(--mute); } #msg.bad { color:var(--red); }
  .hint { color:var(--mute); font-size:.85rem; margin:14px 2px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
  .card.open { border-color:var(--accent); }
  .row { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; user-select:none; }
  .row:hover { background:var(--accent-soft); } .row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .chev { color:var(--accent); transition:transform .15s; font-size:1.1rem; } .card.open .chev { transform:rotate(90deg); }
  .info { flex:1; min-width:0; } .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .store, .wait { color:var(--mute); font-size:.85rem; }
  .right { text-align:right; } .price { font-size:1.2rem; font-weight:700; } .delta { font-size:.8rem; }
  .down { color:var(--green); } .up { color:var(--red); } .flat { color:var(--mute); }
  .detail { padding:4px 16px 16px; border-top:1px solid var(--line); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  .controls label { font-size:.85rem; color:var(--mute); display:flex; align-items:center; gap:6px; }
  .controls input { padding:5px 8px; }
  .box { position:relative; height:240px; }
  .actions { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .actions a { color:var(--accent); font-size:.9rem; }
  .err { color:var(--red); font-size:.85rem; margin-top:8px; }
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Price Tracker</h1>
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Password" required>
  <button class="primary">Log in</button>
  <div id="lmsg" style="color:var(--red)"></div>
</form>

<div class="wrap" id="app" hidden>
  <header>
    <h1>Price Tracker</h1>
    <button id="out">Log out</button>
  </header>
  <form id="add">
    <input name="url" type="url" placeholder="Paste a product link" required>
    <input name="name" placeholder="Own name (optional)">
    <button class="primary">Add item</button>
  </form>
  <div id="msg"></div>
  <div class="hint" id="hint" hidden>Click an item to see its price history.</div>
  <div id="list"></div>
</div>

<script>
const SUPABASE_URL = "https://oqhgcezgsagnrtpbapzb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Dv3sK0bjOv8Shorc85oZIw_9l0Nvyh9";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = (p, cur) => { try { return new Intl.NumberFormat(undefined,{style:"currency",currency:cur}).format(p); } catch { return p.toFixed(2) + " " + (cur||""); } };
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const PRESETS = [["7 days",7],["30 days",30],["90 days",90],["All",0]];

let items = [], state = {}, charts = [], timer = null, tries = 0;

function setMsg(text, bad) { $("msg").textContent = text; $("msg").className = bad ? "bad" : ""; }

function bounds(it, s) {          // from/to dates shown in the pickers and used for the chart
  const today = Date.now();
  if (s.preset === "custom") return [s.from, s.to];
  if (s.preset === 0) return [it.history.length ? iso(it.history[0].t) : iso(today), iso(today)];
  return [iso(today - s.preset * 864e5), iso(today)];
}
function inRange(it, s) {
  const [from, to] = bounds(it, s);
  const lo = from ? new Date(from + "T00:00:00").getTime() : -Infinity;
  const hi = to ? new Date(to + "T23:59:59").getTime() : Infinity;
  return it.history.filter(x => x.t >= lo && x.t <= hi);
}

function render() {
  charts.forEach(c => c.destroy()); charts = [];
  const list = $("list"); list.innerHTML = "";
  $("hint").hidden = !items.length;
  if (!items.length) { list.innerHTML = "<p class='wait'>Nothing tracked yet. Paste a link above.</p>"; return; }

  items.forEach(it => {
    const s = state[it.id], open = !!s, h = it.history, last = h[h.length - 1];
    const month = h.filter(x => x.t >= Date.now() - 30 * 864e5);
    let delta = "";
    if (month.length > 1) {
      const d = last.p - month[0].p, pct = month[0].p ? d / month[0].p * 100 : 0;
      delta = `<div class="delta ${d < 0 ? "down" : d > 0 ? "up" : "flat"}">${d > 0 ? "▲ +" : d < 0 ? "▼ " : ""}${d.toFixed(2)} (${pct.toFixed(1)}%) · 30 days</div>`;
    }
    const card = document.createElement("div");
    card.className = "card" + (open ? " open" : "");
    let detail = "";
    if (open) {
      const [from, to] = bounds(it, s);
      detail = `<div class="detail">
        <div class="controls">
          ${PRESETS.map(([l, d]) => `<button class="pill ${s.preset === d ? "on" : ""}" data-p="${d}">${l}</button>`).join("")}
          <label>From <input type="date" data-k="from" value="${from}"></label>
          <label>To <input type="date" data-k="to" value="${to}"></label>
        </div>
        <div class="box"><canvas></canvas></div>
        ${it.last_error ? `<div class="err">Last check failed: ${esc(it.last_error)}</div>` : ""}
        <div class="actions"><a href="${esc(it.url)}" target="_blank" rel="noopener">Open in shop ↗</a>
        <button class="danger">Stop tracking</button></div></div>`;
    }
    card.innerHTML = `<div class="row" role="button" tabindex="0" aria-expanded="${open}">
        <span class="chev">▸</span>
        <div class="info"><div class="name">${esc(it.label)}</div><div class="store">${esc(it.store)}</div></div>
        <div class="right">${last ? `<div class="price">${money(last.p, it.currency)}</div>${delta}`
          : it.last_error ? `<div class="err">Check failed</div>` : `<div class="wait">Checking…</div>`}</div>
      </div>${detail}`;
    list.appendChild(card);

    const toggle = () => { if (state[it.id]) delete state[it.id]; else state[it.id] = { preset: 30, from: "", to: "" }; render(); };
    const row = card.querySelector(".row");
    row.onclick = toggle;
    row.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    if (!open) return;

    card.querySelectorAll(".pill").forEach(b => b.onclick = () => { s.preset = Number(b.dataset.p); render(); });
    card.querySelectorAll("input[type=date]").forEach(inp => inp.onchange = () => {
      const [f, t] = bounds(it, s);
      s.from = f; s.to = t; s[inp.dataset.k] = inp.value; s.preset = "custom"; render();
    });
    card.querySelector(".danger").onclick = async () => {
      if (!confirm("Stop tracking this item?")) return;
      await sb.from("tracked").delete().eq("product_id", it.id);
      delete state[it.id]; load();
    };
    const pts = inRange(it, s);
    const box = card.querySelector(".box");
    if (!pts.length) { box.innerHTML = "<p class='wait'>No checks in this period.</p>"; return; }
    charts.push(new Chart(card.querySelector("canvas"), {
      type: "line",
      data: { datasets: [{ data: pts.map(x => ({ x: x.t, y: x.p })), borderColor: "#2563eb", backgroundColor: "#2563eb22", fill: true, tension: .2, pointRadius: 3, pointHoverRadius: 6 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: i => new Date(i[0].parsed.x).toLocaleString([], { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }),
          label: c => money(c.parsed.y, it.currency) } } },
        scales: { x: { type: "linear", ticks: { maxTicksLimit: 6, callback: v => new Date(v).toLocaleDateString([], { day: "numeric", month: "short" }) } },
                  y: { ticks: { callback: v => money(v, it.currency) } } } }
    }));
  });
}

async function load() {
  clearTimeout(timer);
  const { data: tr, error } = await sb.from("tracked")
    .select("custom_name, products(id,url,name,store,currency,last_error)");
  if (error) { setMsg(error.message, true); return; }
  items = await Promise.all(tr.map(async t => {
    const { data } = await sb.from("prices").select("price,checked_at")
      .eq("product_id", t.products.id).order("checked_at").range(0, 999);
    return { ...t.products, label: t.custom_name || t.products.name || t.products.url,
             history: (data || []).map(x => ({ t: Date.parse(x.checked_at), p: Number(x.price) })) };
  }));
  render();
  // while a new item is waiting for its first price, look again every 20 seconds (up to ~5 min)
  if (items.some(i => !i.history.length && !i.last_error) && tries++ < 15) timer = setTimeout(load, 20000);
}

$("login").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const { error } = await sb.auth.signInWithPassword({ email: f.get("email"), password: f.get("password") });
  $("lmsg").textContent = error ? error.message : "";
};
$("add").onsubmit = async e => {
  e.preventDefault();
  const form = e.target, f = new FormData(form);
  const { error } = await sb.rpc("add_product", { p_url: f.get("url"), p_name: f.get("name") });
  if (error) { setMsg(error.message, true); return; }
  form.reset(); tries = 0; load();
  setMsg("Added. Checking the price now, this takes about a minute…");
  const { error: fe } = await sb.functions.invoke("check-now", { body: {} });
  if (fe) setMsg("Added. The first price will appear at the next scheduled check.", false);
};
$("out").onclick = () => sb.auth.signOut();

function show(session) {
  $("login").hidden = !!session; $("app").hidden = !session;
  if (session) { tries = 0; load(); } else { items = []; state = {}; }
}
sb.auth.onAuthStateChange((_e, session) => show(session));
sb.auth.getSession().then(({ data }) => show(data.session));
</script>
</body>
</html>
